# ==============================================================================
# config.toml — Mini Coding Agent Configuration
#
# Defines model roles, context budgets, command allowlists, and accuracy levers.
# Single source of truth for runtime behavior; no model names are in code.
# ==============================================================================

[models.main]
provider = "ollama"
model = "gemma4:latest"
context_limit = 8192
thinking = false
temperature = 0.1
timeout = 120

[models.fallback]
provider = "ollama"
model = "qwen3.5:9b"
context_limit = 8192
thinking = false
temperature = 0.0
timeout = 180

[budgets]
max_steps = 30
max_time_seconds = 600
max_retries_same_failure = 3
max_consecutive_invalid_calls = 5

[sandbox]
allowed_commands = ["python -m unittest", "python -m unittest discover", "git status", "git diff"]
command_timeout = 30
output_cap_bytes = 10000
approval_timeout = 60

[accuracy]
best_of_n = 1
final_verification = true
no_progress_threshold = 3

[stacks]
# Fallback framework stack when no markers are detected: "nextjs", "vite", "python", "html"
default_stack = "nextjs"

