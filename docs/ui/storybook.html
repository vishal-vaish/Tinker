<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>shadcn/ui Component Catalog (OKLCH Color Palette)</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    /* ==============================================================
       EXACT USER-SUPPLIED OKLCH SHADCN/UI COLOR PALETTE
       ============================================================== */
    :root {
      --background: oklch(0.9581 0 0);
      --foreground: oklch(0.3134 0.0234 253.6270);
      --card: oklch(0.9774 0.0042 236.4961);
      --card-foreground: oklch(0.2022 0.0110 151.1628);
      --popover: oklch(1.0000 0 0);
      --popover-foreground: oklch(0.2505 0.0149 235.6259);
      --primary: oklch(0.6112 0.1217 248.9572);
      --primary-foreground: oklch(1.0000 0 0);
      --secondary: oklch(0.9122 0.0111 243.6627);
      --secondary-foreground: oklch(0.4186 0.0133 235.1330);
      --muted: oklch(0.9209 0.0128 244.2626);
      --muted-foreground: oklch(0.6027 0.0062 211.0375);
      --accent: oklch(0.9122 0.0111 243.6627);
      --accent-foreground: oklch(0.2505 0.0149 235.6259);
      --destructive: oklch(0.1931 0.0037 164.6298);
      --destructive-foreground: oklch(1.0000 0 0);
      --border: oklch(0.8840 0.0067 208.7806);
      --input: oklch(0.7450 0.0121 252.1201);
      --ring: oklch(0.6112 0.1217 248.9572);
      
      --sidebar: oklch(0.9590 0.0059 239.8204);
      --sidebar-foreground: oklch(0.3571 0.0041 196.9738);
      --sidebar-primary: oklch(0.6112 0.1217 248.9572);
      --sidebar-primary-foreground: oklch(0.9881 0 0);
      --sidebar-accent: oklch(0.9122 0.0111 243.6627);
      --sidebar-accent-foreground: oklch(0.3250 0 0);
      --sidebar-border: oklch(0.9401 0 0);
      
      --radius: 0.5rem;
      --tracking-normal: -0.01em;
    }

    .dark {
      --background: oklch(0.1776 0 0);
      --foreground: oklch(0.7905 0.0126 259.8241);
      --card: oklch(0.2638 0.0024 247.9155);
      --card-foreground: oklch(0.9755 0.0045 258.3245);
      --popover: oklch(0.3046 0.0023 247.9001);
      --popover-foreground: oklch(0.9176 0.0026 228.7865);
      --primary: oklch(0.6576 0.1208 252.0832);
      --primary-foreground: oklch(1.0000 0 0);
      --secondary: oklch(0.9774 0.0042 236.4961);
      --secondary-foreground: oklch(0.3046 0.0023 247.9001);
      --muted: oklch(0.2171 0.0025 247.9411);
      --muted-foreground: oklch(0.7559 0.0125 239.9659);
      --accent: oklch(0.2038 0.0067 258.3676);
      --accent-foreground: oklch(0.9590 0.0059 239.8204);
      --destructive: oklch(0.6368 0.2078 25.3313);
      --destructive-foreground: oklch(1.0000 0 0);
      --border: oklch(0.3506 0.0066 248.0169);
      --input: oklch(0.4217 0.0084 248.0280);
      --ring: oklch(0.6576 0.1208 252.0832);
      
      --sidebar: oklch(0.2344 0.0024 247.9303);
      --sidebar-foreground: oklch(0.7905 0.0126 259.8241);
      --sidebar-primary: oklch(0.3250 0 0);
      --sidebar-primary-foreground: oklch(0.9881 0 0);
      --sidebar-accent: oklch(0.1673 0.0016 196.9991);
      --sidebar-accent-foreground: oklch(0.7905 0.0126 259.8241);
      --sidebar-border: oklch(0.9401 0 0);
      
      --radius: 0.5rem;
      --tracking-normal: -0.01em;
    }

    /* Direct OKLCH Utility Binding */
    .bg-background { background-color: var(--background) !important; }
    .text-foreground { color: var(--foreground) !important; }
    
    .bg-card { background-color: var(--card) !important; }
    .text-card-foreground { color: var(--card-foreground) !important; }

    .bg-popover { background-color: var(--popover) !important; }
    .text-popover-foreground { color: var(--popover-foreground) !important; }
    
    .bg-primary { background-color: var(--primary) !important; }
    .text-primary-foreground { color: var(--primary-foreground) !important; }
    .text-primary { color: var(--primary) !important; }
    
    .bg-secondary { background-color: var(--secondary) !important; }
    .text-secondary-foreground { color: var(--secondary-foreground) !important; }
    
    .bg-muted { background-color: var(--muted) !important; }
    .text-muted-foreground { color: var(--muted-foreground) !important; }
    
    .bg-accent { background-color: var(--accent) !important; }
    .text-accent-foreground { color: var(--accent-foreground) !important; }

    .bg-destructive { background-color: var(--destructive) !important; }
    .text-destructive-foreground { color: var(--destructive-foreground) !important; }
    .text-destructive { color: var(--destructive) !important; }
    
    .border-border { border-color: var(--border) !important; }
    .border-input { border-color: var(--input) !important; }
    .border-primary { border-color: var(--primary) !important; }

    .bg-sidebar { background-color: var(--sidebar) !important; }
    .text-sidebar-foreground { color: var(--sidebar-foreground) !important; }
    .border-sidebar-border { border-color: var(--sidebar-border) !important; }

    .focus-ring:focus { outline: none; box-shadow: 0 0 0 2px var(--ring) !important; }
    
    /* Font */
    body {
      font-family: Inter, sans-serif;
      letter-spacing: var(--tracking-normal);
    }
    .font-mono-code {
      font-family: monospace;
    }

    /* Checkerboard preview canvas */
    .canvas-bg {
      background-color: var(--background);
      background-image: 
        linear-gradient(45deg, var(--card) 25%, transparent 25%), 
        linear-gradient(-45deg, var(--card) 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, var(--card) 75%), 
        linear-gradient(-45deg, transparent 75%, var(--card) 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
    }
  </style>
</head>
<body class="bg-background text-foreground flex flex-col h-screen overflow-hidden antialiased select-none transition-colors duration-200">

  <!-- ================= HEADER BAR ================= -->
  <header class="h-12 bg-card border-b border-border flex items-center justify-between px-4 z-20 shrink-0">
    <div class="flex items-center space-x-3">
      <!-- shadcn logo badge -->
      <div class="w-6 h-6 rounded bg-primary text-primary-foreground flex items-center justify-center font-bold text-xs shadow-sm">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/>
        </svg>
      </div>
      <div class="flex items-center space-x-2">
        <span class="font-bold text-sm tracking-tight text-foreground">shadcn/ui</span>
        <span class="text-xs text-muted-foreground font-mono-code">/ OKLCH Component Isolation</span>
      </div>
    </div>

    <!-- Right Controls: Light/Dark Mode Switcher -->
    <div class="flex items-center space-x-3">
      <div class="flex items-center bg-muted p-1 rounded-lg border border-border text-xs">
        <button onclick="toggleTheme('dark')" id="btn-dark" class="px-2.5 py-1 rounded bg-card text-foreground font-semibold flex items-center space-x-1.5 shadow-sm transition">
          <span>🌙 Dark</span>
        </button>
        <button onclick="toggleTheme('light')" id="btn-light" class="px-2.5 py-1 rounded text-muted-foreground hover:text-foreground font-medium flex items-center space-x-1.5 transition">
          <span>☀️ Light</span>
        </button>
      </div>

      <span id="active-component-tag" class="text-xs font-semibold px-2.5 py-1 rounded bg-accent text-accent-foreground border border-border">Button</span>
    </div>
  </header>

  <!-- ================= MAIN BODY ================= -->
  <div class="flex flex-1 overflow-hidden">

    <!-- COMPONENT LIST SIDEBAR -->
    <aside class="w-64 bg-sidebar border-r border-border flex flex-col shrink-0">
      <div class="p-3 border-b border-border">
        <input type="text" placeholder="Search components..." oninput="filterComponents(this.value)" class="w-full bg-background border border-border rounded-md px-2.5 py-1.5 text-xs text-foreground placeholder:text-muted-foreground focus-ring">
      </div>

      <div class="flex-1 overflow-y-auto p-2 space-y-0.5 text-xs font-medium" id="component-nav">
        <!-- Injected via JS -->
      </div>

      <!-- Color Token Inspector Nav Link -->
      <div class="p-2 border-t border-border bg-card/60">
        <button onclick="selectComponent('tokens')" id="nav-tokens" class="w-full flex items-center justify-between px-2.5 py-1.5 rounded-md text-muted-foreground hover:bg-accent hover:text-accent-foreground transition">
          <span class="flex items-center space-x-2">
            <svg class="w-3.5 h-3.5 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m4.93 4.93 4.24 4.24M14.83 9.17l4.24-4.24M14.83 14.83l4.24 4.24M9.17 14.83l-4.24 4.24"/></svg>
            <span class="font-semibold text-primary">OKLCH Color Palette</span>
          </span>
          <span class="text-[10px] font-mono-code px-1.5 py-0.5 rounded bg-muted text-muted-foreground">CSS</span>
        </button>
      </div>
    </aside>

    <!-- COMPONENT SHOWCASE CANVAS -->
    <main class="flex-1 flex flex-col overflow-hidden bg-background">
      
      <!-- Isolated Component Viewport -->
      <div class="flex-1 overflow-auto p-8 flex items-center justify-center canvas-bg" id="canvas-area">
        <div id="component-viewport" class="w-full max-w-xl transition-all">
          <!-- Dynamic Component View Injected Here -->
        </div>
      </div>

      <!-- Bottom Tabs: Interactive Props Knobs & shadcn React Code -->
      <div class="h-64 bg-card border-t border-border flex flex-col shrink-0 select-text">
        <div class="h-9 px-4 border-b border-border flex items-center justify-between bg-muted/40">
          <div class="flex space-x-1 text-xs">
            <button onclick="setTab('controls')" id="tab-controls" class="px-3 py-1 rounded-md font-semibold text-foreground bg-card border border-border">Props Controls</button>
            <button onclick="setTab('code')" id="tab-code" class="px-3 py-1 rounded-md font-medium text-muted-foreground hover:text-foreground">shadcn/ui React Code</button>
            <button onclick="setTab('tokens')" id="tab-tokens" class="px-3 py-1 rounded-md font-medium text-muted-foreground hover:text-foreground">OKLCH Variables</button>
          </div>
          <span class="text-[11px] text-muted-foreground font-mono-code">Isolated Preview Mode</span>
        </div>

        <div id="panel-controls" class="flex-1 overflow-y-auto p-4">
          <div id="controls-content" class="space-y-3"></div>
        </div>

        <div id="panel-code" class="flex-1 overflow-y-auto p-4 hidden font-mono-code text-xs text-primary bg-background/90">
          <pre id="code-snippet" class="whitespace-pre-wrap leading-relaxed">// Code will appear here</pre>
        </div>

        <div id="panel-tokens" class="flex-1 overflow-y-auto p-4 hidden font-mono-code text-xs text-muted-foreground bg-background/90">
          <pre id="tokens-snippet" class="whitespace-pre-wrap leading-relaxed"></pre>
        </div>
      </div>

    </main>

  </div>

  <!-- ================= JAVASCRIPT ================= -->
  <script>
    let currentComponent = 'button';
    let currentTab = 'controls';
    let isDark = true;

    function toggleTheme(mode) {
      isDark = (mode === 'dark');
      const root = document.documentElement;
      const btnDark = document.getElementById('btn-dark');
      const btnLight = document.getElementById('btn-light');

      if (isDark) {
        root.classList.add('dark');
        btnDark.className = "px-2.5 py-1 rounded bg-card text-foreground font-semibold flex items-center space-x-1.5 shadow-sm transition";
        btnLight.className = "px-2.5 py-1 rounded text-muted-foreground hover:text-foreground font-medium flex items-center space-x-1.5 transition";
      } else {
        root.classList.remove('dark');
        btnLight.className = "px-2.5 py-1 rounded bg-card text-foreground font-semibold flex items-center space-x-1.5 shadow-sm transition";
        btnDark.className = "px-2.5 py-1 rounded text-muted-foreground hover:text-foreground font-medium flex items-center space-x-1.5 transition";
      }
      selectComponent(currentComponent);
    }

    const knobs = {
      button: { variant: 'default', size: 'default', label: 'Primary Action', loading: false, disabled: false },
      badge: { variant: 'default', label: 'Verified' },
      input: { disabled: false, placeholder: 'Enter prompt or filename...', error: false },
      tabs: { activeTab: 'preview' },
      accordion: { open: false },
      switch: { checked: true }
    };

    const componentList = [
      { id: 'button', name: 'Button', icon: '🔘' },
      { id: 'badge', name: 'Badge', icon: '🏷️' },
      { id: 'input', name: 'Input & Textarea', icon: '📝' },
      { id: 'card', name: 'Card', icon: '💳' },
      { id: 'tabs', name: 'Tabs', icon: '📑' },
      { id: 'accordion', name: 'Accordion', icon: '📂' },
      { id: 'alert', name: 'Alert', icon: '🚨' },
      { id: 'switch', name: 'Switch & Checkbox', icon: '🔘' },
      { id: 'avatar', name: 'Avatar', icon: '👤' },
      { id: 'dialog', name: 'Dialog (Modal)', icon: '🪟' },
      { id: 'sidebar', name: 'Sidebar Nav Item', icon: '📐' }
    ];

    function renderNav() {
      const container = document.getElementById('component-nav');
      container.innerHTML = componentList.map(c => `
        <button onclick="selectComponent('${c.id}')" id="nav-${c.id}" class="w-full flex items-center space-x-2 px-2.5 py-1.5 rounded-md text-sidebar-foreground hover:bg-sidebar-accent hover:text-sidebar-accent-foreground transition ${c.id === currentComponent ? 'bg-sidebar-accent text-sidebar-accent-foreground font-semibold border border-border' : ''}">
          <span>${c.icon}</span>
          <span>${c.name}</span>
        </button>
      `).join('');
    }

    // Isolated Component Registry
    const registry = {
      // 1. BUTTON
      button: {
        render: () => {
          const { variant, size, label, loading, disabled } = knobs.button;
          
          let vClass = "bg-primary text-primary-foreground hover:opacity-90 shadow-sm";
          if (variant === 'secondary') vClass = "bg-secondary text-secondary-foreground hover:opacity-80 border border-border";
          if (variant === 'outline') vClass = "border border-input bg-background hover:bg-accent hover:text-accent-foreground text-foreground";
          if (variant === 'destructive') vClass = "bg-destructive text-destructive-foreground hover:opacity-90";
          if (variant === 'ghost') vClass = "hover:bg-accent hover:text-accent-foreground text-muted-foreground";
          if (variant === 'link') vClass = "text-primary underline-offset-4 hover:underline";

          let sClass = "h-9 px-4 py-2 text-xs";
          if (size === 'sm') sClass = "h-7 rounded-md px-3 text-[11px]";
          if (size === 'lg') sClass = "h-11 rounded-md px-8 text-sm";
          if (size === 'icon') sClass = "h-9 w-9 p-0";

          return `
            <div class="space-y-6">
              <!-- Live Isolated Interactive Component -->
              <div class="bg-card border border-border rounded-xl p-8 flex flex-col items-center justify-center min-h-[160px] shadow-sm">
                <button ${disabled || loading ? 'disabled' : ''} class="inline-flex items-center justify-center rounded-md font-medium transition-colors focus-ring disabled:pointer-events-none disabled:opacity-50 ${vClass} ${sClass}">
                  ${loading ? `
                    <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-current" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    <span>Loading...</span>
                  ` : size === 'icon' ? `
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                  ` : `
                    <span>${label}</span>
                  `}
                </button>
              </div>

              <!-- All Variants Matrix (Isolated Display) -->
              <div class="bg-card border border-border rounded-lg p-4">
                <span class="text-[11px] font-mono-code text-muted-foreground block mb-3 uppercase font-semibold">All Button Variants</span>
                <div class="flex flex-wrap gap-2.5 items-center">
                  <button class="h-9 px-4 py-2 text-xs font-semibold rounded-md bg-primary text-primary-foreground shadow-sm">Default</button>
                  <button class="h-9 px-4 py-2 text-xs font-medium rounded-md bg-secondary text-secondary-foreground border border-border">Secondary</button>
                  <button class="h-9 px-4 py-2 text-xs font-medium rounded-md border border-input bg-background hover:bg-accent text-foreground">Outline</button>
                  <button class="h-9 px-4 py-2 text-xs font-medium rounded-md bg-destructive text-destructive-foreground">Destructive</button>
                  <button class="h-9 px-4 py-2 text-xs font-medium rounded-md hover:bg-accent text-muted-foreground">Ghost</button>
                  <button class="h-9 px-3 text-xs font-medium text-primary hover:underline">Link</button>
                </div>
              </div>
            </div>
          `;
        },
        controls: () => `
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-xs">
            <div>
              <label class="block text-muted-foreground mb-1">Variant</label>
              <select onchange="updateKnob('button', 'variant', this.value)" class="w-full bg-background border border-border rounded p-1.5 text-xs text-foreground">
                <option value="default" ${knobs.button.variant === 'default' ? 'selected' : ''}>default (Primary)</option>
                <option value="secondary" ${knobs.button.variant === 'secondary' ? 'selected' : ''}>secondary</option>
                <option value="outline" ${knobs.button.variant === 'outline' ? 'selected' : ''}>outline</option>
                <option value="destructive" ${knobs.button.variant === 'destructive' ? 'selected' : ''}>destructive</option>
                <option value="ghost" ${knobs.button.variant === 'ghost' ? 'selected' : ''}>ghost</option>
                <option value="link" ${knobs.button.variant === 'link' ? 'selected' : ''}>link</option>
              </select>
            </div>
            <div>
              <label class="block text-muted-foreground mb-1">Size</label>
              <select onchange="updateKnob('button', 'size', this.value)" class="w-full bg-background border border-border rounded p-1.5 text-xs text-foreground">
                <option value="default" ${knobs.button.size === 'default' ? 'selected' : ''}>default (h-9)</option>
                <option value="sm" ${knobs.button.size === 'sm' ? 'selected' : ''}>sm (h-7)</option>
                <option value="lg" ${knobs.button.size === 'lg' ? 'selected' : ''}>lg (h-11)</option>
                <option value="icon" ${knobs.button.size === 'icon' ? 'selected' : ''}>icon (h-9 w-9)</option>
              </select>
            </div>
            <div>
              <label class="block text-muted-foreground mb-1">Label Text</label>
              <input type="text" value="${knobs.button.label}" oninput="updateKnob('button', 'label', this.value)" class="w-full bg-background border border-border rounded p-1.5 text-xs text-foreground">
            </div>
            <div class="flex items-center space-x-3 pt-5">
              <label class="flex items-center space-x-1.5 cursor-pointer">
                <input type="checkbox" ${knobs.button.loading ? 'checked' : ''} onchange="updateKnob('button', 'loading', this.checked)">
                <span>Loading</span>
              </label>
              <label class="flex items-center space-x-1.5 cursor-pointer">
                <input type="checkbox" ${knobs.button.disabled ? 'checked' : ''} onchange="updateKnob('button', 'disabled', this.checked)">
                <span>Disabled</span>
              </label>
            </div>
          </div>
        `,
        code: () => `import { Button } from "@/components/ui/button"\n\n<Button variant="${knobs.button.variant}" size="${knobs.button.size}" ${knobs.button.disabled ? 'disabled' : ''}>\n  ${knobs.button.label}\n</Button>`
      },

      // 2. BADGE
      badge: {
        render: () => `
          <div class="space-y-6">
            <div class="bg-card border border-border rounded-xl p-8 flex flex-wrap gap-3 items-center justify-center min-h-[140px]">
              <span class="inline-flex items-center rounded-full border border-transparent bg-primary text-primary-foreground px-2.5 py-0.5 text-xs font-semibold">
                Default Primary
              </span>
              <span class="inline-flex items-center rounded-full border border-border bg-secondary text-secondary-foreground px-2.5 py-0.5 text-xs font-semibold">
                Secondary
              </span>
              <span class="inline-flex items-center rounded-full border border-input text-foreground px-2.5 py-0.5 text-xs font-semibold">
                Outline
              </span>
              <span class="inline-flex items-center rounded-full bg-destructive text-destructive-foreground px-2.5 py-0.5 text-xs font-semibold">
                Destructive
              </span>
              <span class="inline-flex items-center space-x-1.5 rounded-full border border-border bg-card px-2.5 py-0.5 text-xs font-semibold text-foreground">
                <span class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse"></span>
                <span>Active Agent</span>
              </span>
            </div>

            <div class="bg-card border border-border rounded-lg p-4">
              <span class="text-[11px] font-mono-code text-muted-foreground block mb-3 uppercase font-semibold">Single-Stack Framework Badges</span>
              <div class="flex flex-wrap gap-2">
                <span class="inline-flex items-center space-x-1.5 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-accent text-accent-foreground border border-border">
                  <span>⚛️ React (Vite)</span>
                </span>
                <span class="inline-flex items-center space-x-1.5 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-accent text-accent-foreground border border-border">
                  <span>🐍 Python (FastAPI)</span>
                </span>
                <span class="inline-flex items-center space-x-1.5 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-accent text-accent-foreground border border-border">
                  <span>⚡ Vite Vanilla</span>
                </span>
                <span class="inline-flex items-center space-x-1.5 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-accent text-accent-foreground border border-border">
                  <span>▲ Next.js</span>
                </span>
              </div>
            </div>
          </div>
        `,
        controls: () => `<div class="text-xs text-muted-foreground">Badges utilize <code>--primary</code>, <code>--secondary</code>, and <code>--destructive</code>.</div>`,
        code: () => `import { Badge } from "@/components/ui/badge"\n\n<Badge variant="default">Verified</Badge>`
      },

      // 3. INPUT & TEXTAREA
      input: {
        render: () => `
          <div class="space-y-4 max-w-md mx-auto">
