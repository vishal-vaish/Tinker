<!DOCTYPE html>
<html lang="en" class="h-full bg-zinc-950 text-zinc-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tinker Prototype</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Inter font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="h-full flex items-center justify-center p-6 bg-zinc-950">
  <div id="app" class="w-full max-w-md">
    <div id="login-container" class="bg-zinc-800 p-6 rounded-lg shadow-md">
<h2 class="text-xl font-semibold mb-4">Login</h2>
<form id="login-form" class="space-y-4">
<input type="text" id="username" name="username" placeholder="Username" class="w-full p-3 rounded bg-zinc-700 text-zinc-100 focus:outline-none focus:ring-2 focus:ring-blue-500">
<input type="password" id="password" name="password" placeholder="Password" class="w-full p-3 rounded bg-zinc-700 text-zinc-100 focus:outline-none focus:ring-2 focus:ring-blue-500">
<button type="submit" class="w-full p-3 rounded bg-blue-500 text-zinc-900 font-semibold hover:bg-blue-600 disabled:opacity-50">Login</button>
</form>
<p id="error-message" class="text-red-500 hidden mt-2"></p>
</div>
  </div>
  <script src="script.js"></script>
</body>
</html>
