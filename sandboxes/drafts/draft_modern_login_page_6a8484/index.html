<!DOCTYPE html>
<html lang="en" class="h-full bg-zinc-950 text-zinc-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tinker Prototype</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Inter font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="h-full flex items-center justify-center p-6 bg-zinc-950">
  <div id="app" class="w-full max-w-md">
    <div id="login-form" class="bg-zinc-800 p-6 rounded-lg shadow-md w-full max-w-sm">
  <h2 class="text-xl font-semibold mb-4 text-center">Login</h2>
  <input type="text" id="username" placeholder="Username" class="w-full p-3 mb-4 bg-zinc-700 text-zinc-100 rounded focus:outline-none focus:ring-2 focus:ring-zinc-500">
  <input type="password" id="password" placeholder="Password" class="w-full p-3 mb-6 bg-zinc-700 text-zinc-100 rounded focus:outline-none focus:ring-2 focus:ring-zinc-500">
  <button id="login-button" class="w-full p-3 bg-zinc-600 text-zinc-100 rounded hover:bg-zinc-500 transition-colors">Login</button>
</div>
  </div>
  <script src="script.js"></script>
</body>
</html>
